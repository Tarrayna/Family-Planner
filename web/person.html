<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Edit person</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="sheet-scrim">
  <form class="sheet" id="form">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="heading">Add a person</h2><a class="muted" style="font-size:13px" href="family.html">Cancel</a></div>
    <div style="display:flex;align-items:center;gap:16px">
      <div id="preview"></div>
      <div class="grow" style="display:flex;flex-direction:column;gap:8px">
        <label class="btn btn-primary" style="min-height:40px">Change photo<input id="photo" type="file" accept="image/*" hidden></label>
        <span class="muted" style="font-size:11.5px;line-height:1.45">Take one or pick from your library · stays on the server</span>
      </div>
    </div>
    <label class="field"><span>Name</span><input class="input" name="name" id="name" placeholder="e.g. Jordan" required></label>
    <div class="field"><span>Color</span>
      <div id="colors" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"></div>
    </div>
    <div class="field"><span>Uses a phone?</span>
      <div class="row" id="phone"></div>
    </div>
    <p class="muted" style="font-size:11.5px;margin:0">Added to the family on the server — they'll show up when assigning tasks and get their own color everywhere.</p>
    <div class="row">
      <button class="btn btn-secondary" type="button" id="remove" hidden>Remove</button>
      <button class="btn btn-primary" type="submit" style="flex:2">Save</button>
    </div>
  </form>
</div>
<div class="sheet-scrim" id="cropScrim" hidden>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><h2>Crop photo</h2><button type="button" class="muted" style="font-size:13px" id="cropCancel">Cancel</button></div>
    <div id="cropStage" style="position:relative;width:240px;height:240px;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab">
      <img id="cropImg" draggable="false" style="position:absolute">
    </div>
    <div class="row" style="align-items:center;gap:10px;padding:0 4px">
      <span class="muted" style="font-size:12px">Zoom</span>
      <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="flex:1">
    </div>
    <button class="btn btn-primary btn-block" type="button" id="cropSave">Use photo</button>
  </div>
</div>
<script type="module">
import { get, post, patch, send } from './js/api.js';
import { el, avatar, $ } from './js/ui.js';

const PALETTE = ['oklch(0.72 0.15 20)','oklch(0.74 0.15 55)','oklch(0.80 0.14 95)','oklch(0.75 0.15 140)',
  'oklch(0.76 0.12 185)','oklch(0.70 0.14 235)','oklch(0.66 0.15 289)','oklch(0.70 0.15 330)',
  'oklch(0.62 0.10 25)','oklch(0.60 0.08 150)','oklch(0.58 0.09 265)','oklch(0.72 0.02 280)'];

const id = new URLSearchParams(location.search).get('id');
const people = await get('/api/people');
const existing = id ? people.find((p) => p.id === id) : null;
const state = {
  name: existing?.name || '',
  color: existing?.color || PALETTE[3],
  photo_url: existing?.photo_url || null,
  has_phone: existing ? existing.has_phone : true,
};

if (existing) { $('#heading').textContent = 'Edit ' + existing.name; $('#remove').hidden = false; }
$('#name').value = state.name;
$('#name').oninput = (e) => { state.name = e.target.value; draw(); };

// Crop sheet: pick a photo, drag to reposition, slider to zoom, then export
// exactly what's visible in the circular guide as the final square image
// (CSS already renders every avatar as a circle, so no need to mask alpha).
const CROP_STAGE = 240, CROP_OUT = 1024;
let crop = null;

$('#photo').onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) openCropper(file);
};

function openCropper(file) {
  const img = $('#cropImg');
  img.onload = () => {
    const baseScale = CROP_STAGE / Math.min(img.naturalWidth, img.naturalHeight);
    crop = { naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, baseScale, zoom: 1, left: 0, top: 0 };
    $('#cropZoom').value = '1';
    layoutCropImg(true);
    $('#cropScrim').hidden = false;
  };
  img.src = URL.createObjectURL(file);
}

function layoutCropImg(center = false) {
  const scale = crop.baseScale * crop.zoom;
  const w = crop.naturalWidth * scale, h = crop.naturalHeight * scale;
  if (center) { crop.left = (CROP_STAGE - w) / 2; crop.top = (CROP_STAGE - h) / 2; }
  crop.left = Math.min(0, Math.max(CROP_STAGE - w, crop.left));
  crop.top = Math.min(0, Math.max(CROP_STAGE - h, crop.top));
  const img = $('#cropImg');
  img.style.width = w + 'px'; img.style.height = h + 'px';
  img.style.left = crop.left + 'px'; img.style.top = crop.top + 'px';
}

$('#cropZoom').oninput = (e) => { crop.zoom = Number(e.target.value); layoutCropImg(); };

let dragFrom = null;
$('#cropStage').onpointerdown = (e) => {
  $('#cropStage').setPointerCapture(e.pointerId);
  dragFrom = { x: e.clientX, y: e.clientY, left: crop.left, top: crop.top };
};
$('#cropStage').onpointermove = (e) => {
  if (!dragFrom) return;
  crop.left = dragFrom.left + (e.clientX - dragFrom.x);
  crop.top = dragFrom.top + (e.clientY - dragFrom.y);
  layoutCropImg();
};
$('#cropStage').onpointerup = $('#cropStage').onpointercancel = () => { dragFrom = null; };

$('#cropCancel').onclick = () => { $('#cropScrim').hidden = true; };

$('#cropSave').onclick = () => {
  const out = document.createElement('canvas');
  out.width = CROP_OUT; out.height = CROP_OUT;
  const scaleOut = CROP_OUT / CROP_STAGE;
  const img = $('#cropImg');
  out.getContext('2d').drawImage(img, crop.left * scaleOut, crop.top * scaleOut, img.width * scaleOut, img.height * scaleOut);
  out.toBlob((blob) => {
    state.file = blob;
    state.photo_url = URL.createObjectURL(blob);
    draw();
    $('#cropScrim').hidden = true;
  }, 'image/jpeg', 0.96);
};

function draw() {
  $('#preview').replaceChildren(avatar(state, 76, 2));
  $('#colors').replaceChildren(...PALETTE.map((c) => el('button', {
    type: 'button', 'aria-label': 'Colour',
    style: `aspect-ratio:1;border-radius:var(--r-md);display:grid;place-items:center;border:1px solid ${c === state.color ? c : 'var(--divider)'};` +
      `background:${c === state.color ? `color-mix(in srgb,${c} 22%,transparent)` : 'var(--bg)'}`,
    onclick: () => { state.color = c; draw(); },
  }, el('div', { style: `width:18px;height:18px;border-radius:50%;background:${c}` }))));
  $('#phone').replaceChildren(...[
    { v: true, t: 'Yes', s: 'Can open the app and edit' },
    { v: false, t: 'No', s: 'Assigned only — someone else checks off' },
  ].map((o) => el('button', {
    type: 'button', class: 'pill', 'aria-pressed': state.has_phone === o.v ? 'true' : 'false',
    style: 'flex-direction:column;gap:2px;min-height:64px;align-items:flex-start;padding:10px 14px',
    onclick: () => { state.has_phone = o.v; draw(); },
  }, el('div', { style: 'font-size:14.5px' }, o.t), el('div', { class: 'muted', style: 'font-size:11px;line-height:1.35' }, o.s))));
}
draw();

$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: state.name, color: state.color, has_phone: state.has_phone };
  const person = existing ? await patch('/api/people/' + existing.id, body) : await post('/api/people', body);
  if (state.file) {
    const fd = new FormData();
    fd.append('file', state.file, 'avatar.jpg');
    try { await fetch('/api/people/' + person.id + '/photo', { method: 'POST', body: fd }); }
    catch (e) { console.warn('[person] photo upload failed, offline?', e); }
  }
  location.href = 'family.html';
};
$('#remove').onclick = async () => {
  if (confirm(`Remove ${existing.name}? Their tasks stay but become unassigned.`)) {
    await send('DELETE', '/api/people/' + existing.id);
    location.href = 'family.html';
  }
};
</script><script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</body>
</html>
