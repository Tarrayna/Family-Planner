<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Planner — Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>html,body{overflow:hidden;cursor:none}</style>
</head>
<body>
<main class="tv" id="root"></main>
<script type="module">
import { get } from './js/api.js';
import { el, avatarCq, byId, fmtTime, poll, $, DOW, MONTH, isoDate } from './js/ui.js';
import { clock, weather, legend, rail, checkLayout } from './js/tv.js';

let people = byId(await get('/api/people'));
let cfg = await get('/api/settings/display');
checkLayout(cfg, 'tv-week.html');
let use24 = cfg.time_format === '24h';

function weekStart(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }

async function render() {
  people = byId(await get('/api/people'));
  cfg = await get('/api/settings/display');
  checkLayout(cfg, 'tv-week.html');
  use24 = cfg.time_format === '24h';
  const today = new Date();
  const start = weekStart(today);
  const iso = isoDate;
  const end = new Date(start); end.setDate(end.getDate() + 6);

  const [day, range] = await Promise.all([
    get('/api/day?date=' + iso(today)),
    get(`/api/range?from=${iso(start)}&to=${iso(end)}`),
  ]);

  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const key = iso(d);
    const evs = range.events.filter((e) => e.starts_at.slice(0, 10) === key)
      .sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    const isToday = key === iso(today);
    cols.push(el('div', { class: 'tv-day' + (isToday ? ' today' : '') },
      el('div', { style: 'display:flex;align-items:baseline;gap:.5cqw' },
        el('div', { class: 'lbl' }, DOW[d.getDay()].toUpperCase()),
        el('div', { class: 'num' }, String(d.getDate()))),
      el('div', { style: 'display:flex;flex-direction:column;gap:.75cqw' },
        ...evs.map((e) => el('div', { class: 'tv-item' },
          avatarCq(people[e.assignee_id], 1.6, 0.11),
          el('div', { class: 'grow', style: 'min-width:0' },
            el('div', { class: 'tt' }, fmtTime(e.starts_at, use24)),
            el('div', { class: 'nn' }, e.title)))))));
  }

  $('#root').replaceChildren(
    el('div', { class: 'tv-head', style: 'align-items:flex-end' },
      el('div', { style: 'display:flex;align-items:flex-end;gap:2.5cqw;min-width:0' },
        el('div', {},
          el('div', { class: 'tv-kicker' }, 'This week'),
          el('div', { class: 'tv-date sm' },
            `${MONTH[start.getMonth()]} ${start.getDate()} – ${end.getDate()}`)),
        legend(Object.values(people))),
      el('div', { class: 'tv-right', style: 'align-items:center' },
        cfg.show_weather && weather(day.weather), clock(use24, true))),
    el('div', { class: 'tv-body' },
      el('div', { class: 'tv-week' }, ...cols),
      rail(day, people, cfg.phone_url)));
}
poll(render);
</script>
</body>
</html>
