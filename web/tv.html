<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Planner — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>html,body{overflow:hidden;cursor:none}</style>
</head>
<body>
<main class="tv" id="root"></main>
<script type="module">
import { get } from './js/api.js';
import { el, avatarCq, byId, fmtTime, poll, $, DOW, WEEKDAY, MONTH, isoDate } from './js/ui.js';
import { clock, weather, rail, checkLayout } from './js/tv.js';

let people = byId(await get('/api/people'));
let cfg = await get('/api/settings/display');
checkLayout(cfg, 'tv.html');

let use24 = cfg.time_format === '24h';

const dayLabel = (u) => {
  if (!u.date) return u.day;
  const d = new Date(u.date + 'T00:00:00');
  return `${DOW[d.getDay()]} ${d.getDate()}`;
};

async function render() {
  people = byId(await get('/api/people'));
  cfg = await get('/api/settings/display');
  checkLayout(cfg, 'tv.html');
  use24 = cfg.time_format === '24h';
  const day = await get('/api/day?date=' + isoDate());
  const d = new Date(day.date + 'T00:00:00');

  const main = el('div', { class: 'tv-main' },
    el('div', { class: 'tv-label' }, 'Today'),
    el('div', { style: 'display:flex;flex-direction:column;gap:.75cqw' },
      ...(day.events.length ? day.events.map((e) => {
        const who = people[e.assignee_id];
        return el('div', { class: 'tv-ev', style: who ? `border-left-color:${who.color}` : '' },
          who && el('div', { class: 'tv-chip', style: `background:color-mix(in srgb,${who.color} 20%,transparent);color:${who.color}` },
            avatarCq(who, 2.1), el('span', {}, who.name)),
          el('div', { class: 'time' }, fmtTime(e.starts_at, use24)),
          el('div', { class: 'grow', style: 'min-width:0' },
            el('div', { class: 'title' }, e.title),
            e.sub && el('div', { class: 'sub' }, e.sub)));
      }) : [el('div', { style: 'font-size:2cqw;color:var(--n500)' }, 'Nothing on the calendar today')])));

  if (cfg.show_upcoming && day.upcoming?.length) {
    main.append(el('div', { style: 'margin-top:.8cqw;display:flex;flex-direction:column;gap:1cqw' },
      el('div', { class: 'tv-label' }, 'Coming up'),
      ...day.upcoming.map((u) => el('div', { class: 'tv-up' },
        el('div', { class: 'd' }, dayLabel(u)), el('div', { class: 't' }, u.title), el('div', { class: 'x' }, u.time)))));
  }

  $('#root').replaceChildren(
    el('div', { class: 'tv-head' },
      el('div', {},
        el('div', { class: 'tv-kicker' }, WEEKDAY[d.getDay()]),
        el('div', { class: 'tv-date' }, `${MONTH[d.getMonth()]} ${d.getDate()}`)),
      el('div', { class: 'tv-right' }, cfg.show_weather && weather(day.weather, true), clock(use24))),
    el('div', { class: 'tv-body' }, main, rail(day, people, cfg.phone_url)));
}
poll(render);
</script>
</body>
</html>
