<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Week</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="phone">
  <div class="topbar">
    <div><div class="kicker" id="kicker">This week</div><h1 id="title">—</h1></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="back" id="prev" aria-label="Previous week">‹</button>
      <button class="back" id="next" aria-label="Next week">›</button>
    </div>
  </div>
  <div class="viewbar" id="switch"></div>
  <div class="legend" id="legend"></div>
  <div class="wk" id="week"></div>
</main>
<a class="fab" href="task.html" aria-label="Add">+</a>
<script type="module">
import { get } from './js/api.js';
import { el, avatar, byId, fmtTime, $, MONTH, DOW, isoDate, tabbar, viewSwitch } from './js/ui.js';

const people = byId(await get('/api/people'));
$('#switch').replaceChildren(viewSwitch('week'));
$('#legend').replaceChildren(...Object.values(people).map((p) => el('div', {}, avatar(p, 20), p.name)));

const startOf = (d) => { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0, 0, 0, 0); return x; };
let cursor = startOf(new Date());

async function draw() {
  const end = new Date(cursor); end.setDate(end.getDate() + 6);
  const data = await get(`/api/range?from=${isoDate(cursor)}&to=${isoDate(end)}`);
  const today = isoDate();

  $('#title').textContent = cursor.getMonth() === end.getMonth()
    ? `${MONTH[cursor.getMonth()]} ${cursor.getDate()} – ${end.getDate()}`
    : `${MONTH[cursor.getMonth()].slice(0, 3)} ${cursor.getDate()} – ${MONTH[end.getMonth()].slice(0, 3)} ${end.getDate()}`;
  $('#kicker').textContent = isoDate(startOf(new Date())) === isoDate(cursor) ? 'This week' : cursor.getFullYear();

  const box = $('#week'); box.replaceChildren();
  for (let i = 0; i < 7; i++) {
    const d = new Date(cursor); d.setDate(d.getDate() + i);
    const key = isoDate(d);
    const evs = data.events.filter((e) => e.starts_at.slice(0, 10) === key)
      .sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    const tasks = (data.tasks || []).filter((t) => t.due_date === key && !t.completed_at);

    const card = el('div', { class: 'wk-day', 'data-today': key === today ? '1' : '0' },
      el('div', { class: 'hd' },
        el('div', { class: 'lbl' }, DOW[d.getDay()].toUpperCase()),
        el('div', { class: 'num' }, String(d.getDate())),
        tasks.length ? el('div', { class: 'cnt' }, tasks.length + (tasks.length === 1 ? ' task' : ' tasks')) : null));

    if (!evs.length && !tasks.length) card.append(el('div', { class: 'wk-empty' }, 'Clear'));
    for (const e of evs) {
      card.append(el('div', { class: 'wk-row' },
        avatar(people[e.assignee_id], 26),
        el('div', { class: 't' }, fmtTime(e.starts_at)),
        el('div', { class: 'n' }, e.title)));
    }
    for (const t of tasks) {
      card.append(el('div', { class: 'wk-row' },
        avatar(people[t.assignee_id], 26),
        el('div', { class: 't', style: 'color:var(--n600)' }, 'task'),
        el('div', { class: 'n', style: 'color:var(--n300)' }, t.title)));
    }
    box.append(card);
  }
}
$('#prev').onclick = () => { cursor.setDate(cursor.getDate() - 7); draw(); };
$('#next').onclick = () => { cursor.setDate(cursor.getDate() + 7); draw(); };
await draw();
tabbar();
</script><script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
</script>
</body>
</html>
