<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Family</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="phone">
  <div class="topbar"><h1>Family</h1></div>
  <div class="section" id="list"></div>
  <p class="muted" style="font-size:11.5px;padding:8px 20px">Anyone can edit anyone — no owners, no permissions.</p>
</main>
<script type="module">
import { get } from './js/api.js';
import { el, avatar, $, tabbar } from './js/ui.js';

const people = await get('/api/people');
const list = $('#list');
for (const p of people) {
  list.append(el('a', { class: 'listrow', style: 'min-height:72px', href: '/person.html?id=' + p.id },
    avatar(p, 44, 2),
    el('div', { class: 'grow', style: 'min-width:0' },
      el('div', { style: 'font-size:16px;font-weight:500' }, p.name),
      el('div', { class: 'muted', style: 'font-size:11.5px' }, p.has_phone ? 'Phone' : 'No phone — assigned only')),
    el('div', { class: 'chev' }, '›')));
}
list.append(el('a', { class: 'listrow dashed', href: '/person.html?new=1' },
  el('div', { class: 'ava', style: 'width:44px;height:44px;border:1px dashed var(--n700);font-size:20px;color:var(--n500)' }, '+'),
  el('div', { class: 'grow muted', style: 'font-size:15px' }, 'Add a person')));
tabbar();
</script><script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</body>
</html>
