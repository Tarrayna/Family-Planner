services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: /app/data/planner.db
      SESSION_SECRET: ${SESSION_SECRET}
      PHONE_URL: https://calendar.home
      TZ: America/Chicago
    volumes:
      - sqlite_data:/app/data
      - photos:/app/photos

volumes:
  sqlite_data:
  photos:
  caddy_data:
  caddy_config:
